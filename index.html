<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>请用浏览器打开</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px 20px; }
    h2 { color: #333; }
    p { font-size: 16px; margin: 20px 0; }
    #copyLink { width: 90%; padding: 10px; font-size: 16px; }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 5px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h2>请复制链接到浏览器打开</h2>
  <p>本页面无法在微信中访问</p >
  <p>请长按复制以下链接，并粘贴到手机浏览器打开：</p >
  <input id="copyLink" value="https://static1.laiyifen.com/files/broadcast-grapher-app-api/image/9c7a5ad377324e328b81e06b1a0da36a.html?code=085608" readonly>
  <br>
  <button onclick="copyToClipboard()">复制链接</button>
  <p style="margin-top:30px; font-size:13px; color:#aaa;">技术支持：安全跳转提示页</p >

  <script>
    function copyToClipboard() {
      const input = document.getElementById("copyLink");
      input.select();
      input.setSelectionRange(0, 99999); // for mobile
      document.execCommand("copy");
      alert("链接已复制，请粘贴到手机浏览器打开");
    }
  </script>
</body>
</html>
